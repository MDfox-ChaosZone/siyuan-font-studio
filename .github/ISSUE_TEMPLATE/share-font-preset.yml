name: 分享字体方案
description: 分享字体方案点这里,给插件提建议提问题点下面
title: "[字体方案分享] "
labels: ["字体方案分享"]
body:
  - type: markdown
    attributes:
      value: 保留标题前缀 **[字体方案分享]**，后面填写字体方案名称、个人昵称、诗歌，或任何你想写的内容。
  - type: textarea
    id: description
    attributes:
      label: 字体方案介绍
      description: 将字体方案压缩包里readme.md中的表格粘贴到此,还可以写一些简单介绍哦.
  - type: textarea
    id: preview
    attributes:
      label: 效果截图
      description: (可选)截图展示字体方案效果
  - type: textarea
    id: file
    attributes:
      label: 字体方案压缩包
      description: 将插件导出的 ZIP 拖入此处。GitHub 限制单个 ZIP 附件小于 25 MB；可在插件导出时选择拆分，并把全部分包上传到此字段。也可使用体积更小的 WOFF2 字体或提供网盘链接。
    validations:
      required: true
