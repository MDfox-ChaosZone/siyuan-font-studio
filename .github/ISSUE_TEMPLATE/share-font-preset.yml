name: 分享字体方案分享
description: 标题填写方案名称，想不到可以随便取一个。
body:
  - type: textarea
    id: description
    attributes:
      label: 简介
      description: 介绍适用场景与视觉效果，最多 1000 字。
  - type: textarea
    id: preview
    attributes:
      label: 效果截图
      description: 将截图拖入此输入框，建议展示文档和界面效果。
  - type: checkboxes
    id: license
    attributes:
      label: 字体授权确认
      options:
        - label: 我已确认所用字体可免费商用或开源；若方案文件包含字体，我也确认这些字体允许随方案再分发。
          required: true
  - type: textarea
    id: file
    attributes:
      label: 方案文件
      description: 将插件导出的 ZIP 或 JSON 拖入此处。Issue 附件每个文件最大 25 MB；超过时可填写无需登录、无需提取码且能直接下载文件的 HTTPS 网盘链接（例如 GitHub Release 文件链接）。自动发布支持的文件最大为 100 MB。
    validations:
      required: true
